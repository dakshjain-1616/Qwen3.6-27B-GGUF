[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen36gguf"
version = "0.1.0"
description = "Production-ready GGUF quantization pipeline for Qwen3.6-27B"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Neo", email = "neo@example.com"}
]
keywords = ["gguf", "quantization", "deepseek", "llama", "ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1.0",
    "huggingface-hub>=0.20.0",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "safetensors>=0.4.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-pyyaml>=6.0.12",
    "types-psutil>=5.9.5",
]

[project.scripts]
qwen36gguf = "qwen36gguf.cli:main"

[project.urls]
Homepage = "https://github.com/neo/qwen36gguf"
Repository = "https://github.com/neo/qwen36gguf"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen36gguf"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["vendor", "out"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=qwen36gguf --cov-report=term-missing --cov-fail-under=80"
markers = [
    "smoke: end-to-end smoke test on TinyLlama; opt in via `pytest -m smoke`",
]

[tool.coverage.run]
source = ["src/qwen36gguf"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
